<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diffusion CRM</title><style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}header{background:#172033;color:#fff;padding:18px}main{max-width:1200px;margin:25px auto;padding:0 18px}.card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin-bottom:16px}button{padding:9px 13px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer}input,textarea,select{padding:10px;border:1px solid #ccd5e1;border-radius:8px;width:100%;box-sizing:border-box;margin:5px 0 12px}nav button{margin:4px;background:#33415c}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.map{height:300px;background:#eaf0f6;border-radius:10px;overflow:hidden}.map iframe{width:100%;height:100%;border:0}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header><strong>Diffusion CRM</strong><nav><button onclick="view('structures')">Annuaire</button><button onclick="view('lists')">Listes de diffusion</button><button onclick="view('geo')">Recherche géographique</button><button onclick="view('emails')">Historique e-mails</button><button onclick="view('settings')">Utilisateurs & boîtes</button></nav></header><main id="app"></main><script>
let token=localStorage.token;
const A=async(u,o={})=>{o.headers={...(o.headers||{}),Authorization:'Bearer '+token};let r=await fetch(u,o);return r.json()};
function login(){document.getElementById('app').innerHTML='<div class="card"><h2>Connexion</h2><input id="email" placeholder="E-mail"><input id="password" type="password" placeholder="Mot de passe"><button onclick="doLogin()">Se connecter</button><p>Premier accès : utilisez l’API /api/auth/register pour créer le compte administrateur.</p></div>'}
async function doLogin(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let x=await r.json();if(x.token){localStorage.token=x.token;token=x.token;view('structures')}else alert('Connexion impossible')}
async function view(v){if(!token)return login();if(v==='structures')return structures();if(v==='lists')return lists();if(v==='geo')return geo();if(v==='emails')return emails();if(v==='settings')return settings()}
async function structures(){let a=await A('/api/structures');app.innerHTML='<div class="card"><h2>Annuaire</h2><input type="file" id="excel"><button onclick="imp()">📥 Importation de fichier Excel</button> <button onclick="addStructure()">+ Structure</button></div><div class="card"><table><tr><th>Structure</th><th>Adresse</th><th>Programmation</th><th>Contacts</th></tr>'+a.map(s=>`<tr><td>${s.name}</td><td>${s.street||''}, ${s.postal_code||''} ${s.city||''}, ${s.region||''}, ${s.country||''}</td><td>${s.programming_period||''}</td><td>${(s.contacts||[]).map(c=>c.name+' — '+(c.role||'')).join('<br>')}</td></tr>`).join('')+'</table></div>'}
async function imp(){let f=document.getElementById('excel').files[0];if(!f)return;let fd=new FormData();fd.append('file',f);let x=await A('/api/import/excel',{method:'POST',body:fd});alert(JSON.stringify(x));structures()}
function addStructure(){let n=prompt('Nom');if(!n)return;fetch('/api/structures',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({name:n})}).then(()=>structures())}
async function lists(){let a=await A('/api/lists');app.innerHTML='<div class="card"><h2>Listes de diffusion</h2>'+a.map(l=>`<div class="card"><b>${l.name}</b> — ${l.members} professionnels <button onclick="members(${l.id})">Voir / envoyer</button></div>`).join('')+'</div>'}
async function members(id){let a=await A('/api/lists/'+id+'/members');app.innerHTML='<div class="card"><h2>Professionnels</h2>'+a.map(c=>`<div class="card"><b>${c.name}</b> — ${c.role||''}<br>${c.email||''} · ${c.phone||''}<br><textarea id="n${c.contact_id}" placeholder="Notes">${c.notes||''}</textarea><small>Dernière modification : ${c.last_modified||'—'}</small></div>`).join('')+'<button onclick="sendList('+id+')">✉ Envoyer un mail à la sélection</button></div>'}
function sendList(id){alert('L’envoi réel sera effectué via la boîte OAuth connectée. Cette API enregistre déjà l’historique et la file d’envoi.')}
function geo(){app.innerHTML='<div class="card"><h2>Recherche géographique</h2><input id="place" placeholder="Le 104, Paris"><input id="radius" type="number" value="200"><button onclick="doGeo()">Rechercher</button><div class="map" id="map"></div><div id="georesults"></div></div>'}
function doGeo(){let p=place.value||'Le 104, Paris';map.innerHTML='<iframe src="https://www.google.com/maps?q='+encodeURIComponent(p)+'&output=embed"></iframe>';A('/api/structures').then(a=>georesults.innerHTML='<table><tr><th>Structure</th><th>Ville</th><th>Type</th></tr>'+a.map(s=>'<tr><td>'+s.name+'</td><td>'+s.city+'</td><td>'+s.type+'</td></tr>').join('')+'</table>')}
async function emails(){let a=await A('/api/emails');app.innerHTML='<div class="card"><h2>Historique des e-mails</h2>'+a.map(e=>`<div class="card"><b>${e.subject||'(sans objet)'}</b><br>À : ${e.to_email}<br>${new Date(e.created_at).toLocaleString('fr-FR')}<hr><pre style="white-space:pre-wrap">${e.body||''}</pre></div>`).join('')+'</div>'}
async function settings(){let a=await A('/api/mailboxes');app.innerHTML='<div class="grid"><div class="card"><h2>Utilisateurs</h2><p>Authentification par compte et rôles côté serveur.</p></div><div class="card"><h2>Boîtes mails</h2>'+a.map(x=>'<p><b>'+x.email+'</b> — '+x.provider+'</p>').join('')+'<input id="mb" placeholder="nouvelle boîte"><select id="prov"><option>Gmail</option><option>Outlook</option><option>SMTP</option></select><button onclick="mailbox()">Ajouter</button></div></div>'}
async function mailbox(){await A('/api/mailboxes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:mb.value,provider:prov.value})});settings()}
view('structures');
</script></body></html>
